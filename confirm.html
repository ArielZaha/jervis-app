<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jervis</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    background: #0b0d12; color: #e8eaf0; font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .card {
    width: 100%; max-width: 420px; background: #151822; border: 1px solid #262b3a; border-radius: 16px;
    padding: 28px 24px; text-align: center;
  }
  h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
  p { color: #9aa1b4; font-size: 15px; margin: 0 0 22px; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  button, .link-btn {
    width: 100%; padding: 15px; border-radius: 10px; border: none; background: #4a63e8; color: white;
    font-size: 16px; font-weight: 600; cursor: pointer; display: block; text-decoration: none;
    box-sizing: border-box;
  }
  button:active, .link-btn:active { background: #3c52c4; }
  button.secondary { background: #1e2330; color: #c6cad6; }
  button.secondary:active { background: #262c3d; }
  button:disabled { background: #2c3244; color: #6a7186; cursor: default; }
  .status-icon { font-size: 40px; margin-bottom: 12px; }
  .hint { font-size: 13px; color: #6a7186; margin-top: 16px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <h1 id="title">Jervis wants to connect to this computer.</h1>
    <p id="sub">Confirm only if you asked for this just now.</p>
    <div class="actions" id="actions">
      <button id="confirmBtn">Confirmed</button>
      <button class="secondary" id="rejectBtn">Not Confirmed</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const computerId = params.get("computerId") || "";
  const sessionId = params.get("sessionId") || "";
  const secret = params.get("secret") || "";

  function showResult(decision, ok) {
    const card = $("card");
    if (decision === "confirm" && ok) {
      card.innerHTML = '<div class="status-icon">✓</div>' +
        '<h1>Your phone is connected.</h1>' +
        '<p>Jervis knows on your computer too. You can close this page, or keep talking to Jervis here.</p>' +
        '<div class="actions"><a class="link-btn" id="openBtn">Open Jervis</a></div>';
      $("openBtn").href = `/?session=${encodeURIComponent(sessionId)}&decision=confirm`;
    } else if (decision === "reject" && ok) {
      card.innerHTML = '<div class="status-icon">✕</div><h1>Connection cancelled.</h1>' +
        '<p>Nothing was connected. You can close this page.</p>';
    } else {
      card.innerHTML = '<div class="status-icon">⚠</div><h1>That didn\'t work.</h1>' +
        '<p>This request may have expired, or your computer isn\'t reachable right now. Ask Jervis to ' +
        '"connect my phone" again for a fresh one.</p>';
    }
  }

  async function decide(decision) {
    $("confirmBtn").disabled = true;
    $("rejectBtn").disabled = true;
    $("hint").textContent = "";
    if (!sessionId || !secret) {
      showResult(decision, false);
      return;
    }
    let ok = false;
    try {
      const url = `/decide?computerId=${encodeURIComponent(computerId)}&sessionId=${encodeURIComponent(sessionId)}` +
        `&secret=${encodeURIComponent(secret)}&decision=${decision}`;
      const response = await fetch(url);
      ok = response.ok;
    } catch { /* network error: ok stays false, shown as the same "didn't work" state */ }
    showResult(decision, ok);
  }

  $("confirmBtn").onclick = () => decide("confirm");
  $("rejectBtn").onclick = () => decide("reject");

  // A native notification action button (when the platform supports one) already decided this before the page
  // ever opened — see phone_sw.js — so this just shows the same result screen instead of asking again.
  const prefilled = params.get("decision");
  if (prefilled === "confirm" || prefilled === "reject") {
    $("actions").style.display = "none";
    $("sub").textContent = "";
    decide(prefilled);
  } else if (!sessionId || !secret) {
    $("title").textContent = "This link is missing something.";
    $("sub").textContent = "Ask Jervis to “connect my phone” again for a fresh link.";
    $("actions").style.display = "none";
  }
})();
</script>
</body>
</html>
