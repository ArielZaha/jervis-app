<!DOCTYPE html>
<!-- Jarvis's own orb (orb.js, unchanged) alone on black, for the film's opening and closing. -->
<html><head><meta charset="UTF-8"><style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #wrap { position: absolute; inset: 0; display: grid; place-items: center; }
  #stage { width: 810px; height: 810px; display: grid; place-items: center; }
</style></head>
<body><div id="wrap"><div id="stage"><canvas id="orbCanvas"></canvas></div></div>
<script src="../../../orb.js"></script>
<script>window.initOrb('orbCanvas');</script>
</body></html>
